name: CI/CD Pipeline

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
    env:
      DOMAIN_NAME: localhost
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

          echo "Waiting for healthy status..."
          for i in {1..20}; do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' hebrew_ai_backend 2>/dev/null || echo "missing")
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Backend did not become healthy in time (last status: $STATUS)"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200 backend postgres redis || true
              exit 1
            fi
            echo "Waiting... (Current status: $STATUS)"
            sleep 10
          done

          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
