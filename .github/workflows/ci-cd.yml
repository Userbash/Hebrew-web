name: AI-Driven CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  LOG_FILE: pipeline.log
  START_TIME: ${{ github.event.repository.pushed_at }} # Approximate start time for duration calculation
  # Placeholder for DOCKER_USERNAME and DOCKER_PASSWORD if needed for deployment
  # DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Overall job timeout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq bc
        
      - name: Define Utility Functions
        id: utility_functions
        run: |
          # --- Logging Utilities ---
          echo 'log() {
            local level=$1
            shift
            local message="$@"
            echo "[$(date +"%Y-%m-%dT%H:%M:%SZ")] [$level] $message" | tee -a ${{ env.LOG_FILE }}
          }' >> "$GITHUB_OUTPUT"
          
          echo 'run_command() {
            local cmd_desc=$1
            local cmd=$2
            log "INFO" "Running: $cmd_desc (Command: $cmd)"
            
            output=$(eval "$cmd" 2>&1)
            exit_code=$?
            
            if [ $exit_code -ne 0 ]; then
              log "ERROR" "Command failed: $cmd_desc. Exit code: $exit_code. Output:"
              echo "$output" | tee -a ${{ env.LOG_FILE }}
              echo "::set-output name=result::failure" >> $GITHUB_OUTPUT
              echo "::set-output name=output::$output" >> $GITHUB_OUTPUT
              return 1
            else
              log "INFO" "Command successful: $cmd_desc. Output:"
              echo "$output" | tee -a ${{ env.LOG_FILE }}
              echo "::set-output name=result::success" >> $GITHUB_OUTPUT
              echo "::set-output name=output::$output" >> $GITHUB_OUTPUT
              return 0
            fi
          }' >> "$GITHUB_OUTPUT"
          
          # --- Error Analysis Functions (from AI-Agent-Commands.md) ---
          echo 'parse_logs() {
            local log_content="$1"
            local error_log_file="$2"
            
            echo "$log_content" | while IFS= read -r line; do
              # Try to parse as JSON if it looks like JSON
              if echo "$line" | jq -e . > /dev/null 2>&1; then
                local timestamp=$(echo "$line" | jq -r ".timestamp // empty")
                local level=$(echo "$line" | jq -r ".level // empty")
                local message=$(echo "$line" | jq -r ".msg // empty")
                
                # Check for error levels (Pino levels 50 is error)
                if [[ "$level" = "50" || "$level" = "ERROR" ]]; then
                  echo "{\"timestamp\": \"$timestamp\", \"level\": \"$level\", \"message\": \"$message\"}" >> "$error_log_file"
                fi
              else
                # Fallback for non-JSON lines, simplistic error detection
                if echo "$line" | grep -iqE "error|fail|failed|exception|denied|refused|timeout|fatal|critical"; then
                  echo "{\"timestamp\": \"$(date +