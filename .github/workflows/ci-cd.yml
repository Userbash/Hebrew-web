name: CI/CD Pipeline

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        run: |
          # Используем переменные среды GitHub Secrets
          # Докер-композ подхватит их из окружения runner'а
          podman compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

          # Нативная проверка готовности (ждем здорового состояния контейнеров)
          echo "Waiting for healthy status..."
          for i in {1..10}; do
            STATUS=$(podman inspect -f '{{.State.Health.Status}}' hebrew_ai_backend)
            if [ "$STATUS" == "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting... (Current status: $STATUS)"
            sleep 10
          done

          # Проверка финального состояния
          podman ps
