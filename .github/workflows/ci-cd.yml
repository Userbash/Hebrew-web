name: AI-Driven CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  LOG_FILE: pipeline.log
  START_TIME: ${{ github.event.repository.pushed_at }} # Approximate start time for duration calculation
  # Placeholder for DOCKER_USERNAME and DOCKER_PASSWORD if needed for deployment
  # DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Overall job timeout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq bc
        
      - name: Make ci_utils.sh executable
        run: chmod +x ./scripts/ci_utils.sh

      - name: Install Backend Dependencies
        run: |
          source ./scripts/ci_utils.sh
          install_npm_deps "backend"

      - name: Start Backend Server
        run: |
          npm start --prefix backend &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 5 # Give the server some time to start up

      - name: Wait for Backend Server to be Ready
        run: |
          echo "Waiting for backend server to be ready..."
          for i in $(seq 1 10); do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/health)
            if [ "$response" -eq 200 ]; then
              echo "Backend server is ready!"
              exit 0
            else
              echo "Backend server not ready yet (status: $response). Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Backend server did not become ready within the timeout."
          exit 1

      - name: Build and Test Backend
        run: |
          source ./scripts/ci_utils.sh
          run_npm_test "backend"
      
      - name: Stop Backend Server
        if: always() # Ensure this runs even if tests fail
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID
            echo "Backend server (PID $SERVER_PID) stopped."
          fi

      - name: Build Backend Docker Image
        run: |
          source ./scripts/ci_utils.sh
          build_docker_image "hebrew-web-backend" "./backend"

      - name: Build Frontend Docker Image
        run: |
          source ./scripts/ci_utils.sh
          build_docker_image "hebrew-web-frontend" "./frontend"

      - name: Run System Tests
        run: |
          source ./scripts/ci_utils.sh
          run_command "Run all system tests" "node tests/run-all-tests.js" # Assuming tests/package.json exists with test script

      - name: Push Docker Images (Placeholder)
        if: github.ref == 'refs/heads/main' # Only push on main branch
        run: |
          source ./scripts/ci_utils.sh
          log "INFO" "Skipping Docker image push for now. Configure your registry login and push commands here."
          # Example:
          # echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          # docker push your-docker-repo/hebrew-web-backend:latest
          # docker push your-docker-repo/hebrew-web-frontend:latest
        