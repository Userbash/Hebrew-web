name: Artifact Retention Cleanup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      RETENTION_DAYS: '7'
      MAX_ARTIFACTS: '50'
    steps:
      - name: Delete old and excessive artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const retentionDays = Number(process.env.RETENTION_DAYS || '7');
            const maxArtifacts = Number(process.env.MAX_ARTIFACTS || '50');
            const cutoffMs = Date.now() - retentionDays * 24 * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
              (response) => response.data.artifacts,
            );

            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let deleted = 0;
            let kept = 0;
            let reasonAge = 0;
            let reasonCount = 0;

            for (let i = 0; i < artifacts.length; i += 1) {
              const artifact = artifacts[i];
              const createdAtMs = new Date(artifact.created_at).getTime();
              const tooOld = createdAtMs < cutoffMs;
              const overLimit = i >= maxArtifacts;

              if (tooOld || overLimit) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                if (tooOld) reasonAge += 1;
                if (!tooOld && overLimit) reasonCount += 1;
                core.info(`Deleted artifact #${artifact.id} (${artifact.name})`);
              } else {
                kept += 1;
              }
            }

            core.info(`Artifacts total: ${artifacts.length}`);
            core.info(`Deleted: ${deleted} (age: ${reasonAge}, count-limit: ${reasonCount})`);
            core.info(`Kept: ${kept}`);
