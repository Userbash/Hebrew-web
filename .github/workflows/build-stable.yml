name: Build Stability (No Orchestrator)

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]
  workflow_dispatch:

jobs:
  build_backend_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend-react/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build Frontend
        working-directory: frontend-react
        run: npm run build

      - name: CI Summary
        run: |
          echo "Stable build completed."
          echo "No orchestrator runtime required."
          echo "No PostgreSQL/Redis/RabbitMQ services required in this workflow."
