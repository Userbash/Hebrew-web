version: '3.9'

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"
    labels: "com.hebrew.service,com.hebrew.component,com.hebrew.log_pipeline"

services:
  traefik:
    image: traefik:v3.3
    container_name: hebrew_ai_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.format=json"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - ":80"
      - ":443"
      - ":8080" # Dashboard
    volumes:
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    labels:
      com.hebrew.service: "traefik"
      com.hebrew.component: "edge"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web
      - observability

  postgres:
    image: postgres:16-alpine
    container_name: hebrew_ai_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hebrew_ai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hebrew.service: "postgres"
      com.hebrew.component: "database"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: hebrew_ai_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hebrew.service: "redis"
      com.hebrew.component: "cache"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: hebrew_ai_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 3001
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-hebrew_ai_db}
      # Required for AI Bridge persistent memory
      AI_BRIDGE_MEMORY_ENABLED: ${AI_BRIDGE_MEMORY_ENABLED:-true}
      AI_BRIDGE_MEMORY_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-hebrew_ai_db}
      ORCHESTRATOR_BRIDGE_URL: ${ORCHESTRATOR_BRIDGE_URL:-http://orchestrator:8000}
      AI_BRIDGE_OPENAI_AUTO_MODEL: ${AI_BRIDGE_OPENAI_AUTO_MODEL:-true}
      OPENAI_SESSION_TOKEN_BUDGET: ${OPENAI_SESSION_TOKEN_BUDGET:-120000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
    volumes:
      - avatar_uploads:/app/public/uploads/avatars
      - ./ai_bridge:/app/ai_bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "com.hebrew.service=backend"
      - "com.hebrew.component=api"
      - "com.hebrew.log_pipeline=loki"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web


  orchestrator:
    profiles:
      - ai
    build:
      context: .
      dockerfile: ./ai_bridge/Dockerfile
    container_name: hebrew_ai_orchestrator
    env_file:
      - .env.gemini.local
    working_dir: /app
    environment:
      PYTHONPATH: /app
      AI_BRIDGE_MEMORY_ENABLED: ${AI_BRIDGE_MEMORY_ENABLED:-true}
      AI_BRIDGE_MEMORY_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-hebrew_ai_db}
      AI_BRIDGE_LIVE_MODEL_PROBE: ${AI_BRIDGE_LIVE_MODEL_PROBE:-false}
      AI_BRIDGE_REQUIRE_EXTERNAL_SCANNERS: ${AI_BRIDGE_REQUIRE_EXTERNAL_SCANNERS:-false}
      AI_BRIDGE_OPENAI_AUTO_MODEL: ${AI_BRIDGE_OPENAI_AUTO_MODEL:-true}
      OPENAI_SESSION_TOKEN_BUDGET: ${OPENAI_SESSION_TOKEN_BUDGET:-120000}
      OPENAI_LOW_MODELS: ${OPENAI_LOW_MODELS:-gpt-5-nano,gpt-4.1-nano,gpt-4o-mini}
      OPENAI_MEDIUM_MODELS: ${OPENAI_MEDIUM_MODELS:-gpt-5-mini,gpt-4.1-mini,gpt-4o-mini}
      OPENAI_HIGH_MODELS: ${OPENAI_HIGH_MODELS:-gpt-5.1-codex,gpt-5.1,gpt-5,gpt-4.1}
      OPENAI_CRITICAL_MODELS: ${OPENAI_CRITICAL_MODELS:-gpt-5.2-codex,gpt-5.2,gpt-5.2-pro,gpt-5.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    labels:
      com.hebrew.service: "orchestrator"
      com.hebrew.component: "ai-bridge"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 10
    networks:
      - web

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: hebrew_ai_frontend
    ports:
      - "8081:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "com.hebrew.service=frontend"
      - "com.hebrew.component=web"
      - "com.hebrew.log_pipeline=loki"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  loki:
    image: grafana/loki:2.9.8
    container_name: hebrew_ai_loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.hebrew.service: "loki"
      com.hebrew.component: "observability"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.8
    container_name: hebrew_ai_promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ${CONTAINER_LOGS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.hebrew.service: "promtail"
      com.hebrew.component: "observability"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - observability

networks:
  web:
    driver: bridge
  observability:
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-hebrew_pgdata}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-hebrew_redisdata}
  certs:
  acme-data:
  loki_data:
  promtail_positions:
  grafana_data:
  avatar_uploads:
