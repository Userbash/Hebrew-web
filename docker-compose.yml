version: '3.9'

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"
    labels: "com.hebrew.service,com.hebrew.component,com.hebrew.log_pipeline"

services:
  traefik:
    image: traefik:v3.3
    container_name: hebrew_ai_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.format=json"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      com.hebrew.service: "traefik"
      com.hebrew.component: "edge"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web
      - observability

  postgres:
    image: postgres:16-alpine
    container_name: hebrew_ai_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hebrew_ai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hebrew.service: "postgres"
      com.hebrew.component: "database"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: hebrew_ai_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hebrew.service: "redis"
      com.hebrew.component: "cache"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: hebrew_ai_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 3001
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-hebrew_ai_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - avatar_uploads:/app/public/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "com.hebrew.service=backend"
      - "com.hebrew.component=api"
      - "com.hebrew.log_pipeline=loki"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: hebrew_ai_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "com.hebrew.service=frontend"
      - "com.hebrew.component=web"
      - "com.hebrew.log_pipeline=loki"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  loki:
    image: grafana/loki:2.9.8
    container_name: hebrew_ai_loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.hebrew.service: "loki"
      com.hebrew.component: "observability"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.8
    container_name: hebrew_ai_promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.hebrew.service: "promtail"
      com.hebrew.component: "observability"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - observability

  grafana:
    image: grafana/grafana:10.4.5
    container_name: hebrew_ai_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      com.hebrew.service: "grafana"
      com.hebrew.component: "observability"
      com.hebrew.log_pipeline: "loki"
    logging: *default-logging
    networks:
      - observability

networks:
  web:
    driver: bridge
  observability:
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-hebrew_pgdata}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-hebrew_redisdata}
  certs:
  acme-data:
  loki_data:
  promtail_positions:
  grafana_data:
  avatar_uploads:
