version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hebrew_ai_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hebrew_ai_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hebrew_ai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hebrew_ai_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-hebrew_ai_db}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_port:-6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DESEC_TOKEN: ${DESEC_TOKEN}
      DOMAIN_NAME: ${DOMAIN_NAME}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cert-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-3001}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./scripts:/scripts
      - certs:/etc/letsencrypt
    entrypoint: /scripts/entrypoint.sh
    restart: unless-stopped

  cert-manager:
    image: neilpang/acme.sh:latest
    container_name: acme-cert-manager
    command: daemon
    environment:
      DESEC_TOKEN: ${DESEC_TOKEN}
    volumes:
      - ./acme-data:/acme.sh
      - ./certs:/etc/letsencrypt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/acme.sh/acme.sh"]
      interval: 60s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hebrew_ai_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certs:
  acme-data:

networks:
  default:
    name: hebrew_ai_network
